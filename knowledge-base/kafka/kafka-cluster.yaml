apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: prod
  namespace: prod
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: prod
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      num.network.threads: 8
      num.io.threads: 16
      log.message.format.version: "3.7"
    storage:
      type: persistent-claim
      size: 800Gi
      class: gp3
    resources:
      requests:
        cpu: "2500m"
        memory: "4Gi"
      limits:
        cpu: "2500m"
        memory: "4Gi"
    jvmOptions:
      -Xms: 3072m
      -Xmx: 3072m
      gcLoggingEnabled: true
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: prod-kafka-jmx
          key: kafka-metrics-config.yaml
    template:
      pod:
        metadata:
          labels:
            scrape: kafka-jmx
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 100Gi
      class: gp3
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  entityOperator:
    topicOperator: {}
    userOperator: {}
